[platformio]
default_envs = esp32-s3-nano

[env:esp32-s3-nano]
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino

; 16MB flash / 8MB octal PSRAM, two ~6.5MB app slots (ota_0 / ota_1) for safe OTA
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
upload_speed  = 921600

extra_scripts = pre:auto_upload.py

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit ST7735 and ST7789 Library@ ^1.11.0
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DSERIAL_PLOT_ENABLE=1

; Used only by GitHub Actions (internet OTA releases). Same firmware, but without
; auto_upload.py, so the local serial / Wi-Fi OTA workflow above is untouched.
[env:ci]
extends = env:esp32-s3-nano
extra_scripts =